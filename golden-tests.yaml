# 판정 엔진 골든 테스트 (시드)
#
# 위치: packages/eligibility/__tests__/golden/ 로 옮겨 사용
# 규칙: 규칙 타입마다 최소 3케이스 (가능 / 불가 / 경계). UNKNOWN 케이스 필수.
#       목표 100케이스, 정확도 95% 미만이면 배포 금지 (CLAUDE.md 6장)
#
# ⚠️ 현재 visa_rules 시드는 18건 중 13건이 confidence='low'다.
#    따라서 아래 케이스 다수가 지금은 UNKNOWN을 반환한다 (설계대로다).
#    지침 원문 대조 후 confidence를 올리면 expect를 갱신한다.
#    → expect_with_low_confidence / expect_when_verified 두 필드를 함께 둔다.

meta:
  engineVersion: "1.0.0"
  rulesetDate: "2026-07-09"
  evaluatedAt: "2026-09-12"

cases:

