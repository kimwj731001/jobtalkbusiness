# ─────────────────────────────────────────────────────────────
#  불변 규칙 자체를 검증하는 메타 테스트
# ─────────────────────────────────────────────────────────────

invariantTests:
  - id: INV-L3-001
    description: 모든 판정 결과의 reasons는 비어 있을 수 없다
    assert: "cases.every(c => result.reasons.length > 0)"

  - id: INV-L3-002
    description: 모든 reason에 sourceTitle과 effectiveFrom이 있다
    assert: "result.reasons.every(r => r.sourceTitle && r.effectiveFrom)"

  - id: INV-L4-001
    description: confidence=low 규칙이 하나라도 적용되면 ELIGIBLE이 나올 수 없다
    assert: "result.ruleSnapshot.some(r => r.confidence === 'low') ? result.status !== 'ELIGIBLE' : true"

  - id: INV-L4-002
    description: INDETERMINATE가 있으면 CONDITIONAL이 아니라 UNKNOWN이다
    assert: "result.reasons.some(r => r.verdict === 'INDETERMINATE') && !result.reasons.some(r => r.verdict === 'FAIL') ? result.status === 'UNKNOWN' : true"

  - id: INV-ORDER-001
    description: FAIL이 있으면 항상 INELIGIBLE이다 (다른 판정으로 완화되지 않는다)
    assert: "result.reasons.some(r => r.verdict === 'FAIL') ? result.status === 'INELIGIBLE' : true"
