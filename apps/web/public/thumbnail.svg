<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="비자잡 — 내 비자로 이 알바 해도 되나? 근거와 함께 답하는 외국인 유학생 구직 서비스">
  <title>비자잡 썸네일</title>

  <defs>
    <style>
      .kr { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif; }
      .tnum { font-variant-numeric: tabular-nums; }
    </style>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E6A6E" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#0E6A6E" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#24262A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#FAFAF9"/>
  <rect width="1200" height="630" fill="url(#wash)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#0E6A6E"/>

  <!-- ── 왼쪽: 메시지 ───────────────────────────────── -->
  <g class="kr">
    <text x="80" y="128" font-size="22" font-weight="700" fill="#0E6A6E" letter-spacing="1.5">비자잡 · VisaJob</text>

    <text x="80" y="232" font-size="64" font-weight="800" fill="#24262A" letter-spacing="-1.5">내 비자로</text>
    <text x="80" y="312" font-size="64" font-weight="800" fill="#24262A" letter-spacing="-1.5">이 알바 해도 되나?</text>

    <text x="80" y="372" font-size="25" font-weight="500" fill="#5B6068" letter-spacing="-0.3">근거와 함께 답하는 외국인 유학생 구직 서비스</text>

    <!-- 태그 -->
    <g>
      <rect x="80" y="430" width="186" height="46" rx="23" fill="#FFFFFF" stroke="#E6E7E9"/>
      <text x="173" y="459" font-size="19" font-weight="600" fill="#5B6068" text-anchor="middle">D-2 · D-4 유학생</text>

      <rect x="278" y="430" width="212" height="46" rx="23" fill="#FFFFFF" stroke="#E6E7E9"/>
      <text x="384" y="459" font-size="19" font-weight="600" fill="#5B6068" text-anchor="middle">회기 · 이문 · 휘경</text>

      <rect x="502" y="430" width="128" height="46" rx="23" fill="#FFFFFF" stroke="#E6E7E9"/>
      <text x="566" y="459" font-size="19" font-weight="600" fill="#5B6068" text-anchor="middle">4개 언어</text>
    </g>

    <text x="80" y="548" font-size="17" font-weight="500" fill="#8B9099">주당 시간 · 업종 · 고용형태 · 통학 거리 · 한국어 급수를 한 번에 판정</text>
  </g>

  <!-- ── 오른쪽: 판정 카드 ──────────────────────────── -->
  <g class="kr" filter="url(#lift)">

    <!-- 카드 1 — 확인 필요 -->
    <g>
      <rect x="700" y="96" width="428" height="190" rx="18" fill="#FFFFFF" stroke="#E6E7E9"/>
      <rect x="724" y="122" width="120" height="34" rx="17" fill="#FDF5E7" stroke="#EFDFBF"/>
      <circle cx="744" cy="139" r="4.5" fill="#A06A14"/>
      <text x="757" y="145" font-size="17" font-weight="700" fill="#A06A14">확인 필요</text>
      <text x="1104" y="146" font-size="21" font-weight="800" fill="#24262A" text-anchor="end" class="tnum">시급 12,500원</text>

      <text x="724" y="196" font-size="22" font-weight="700" fill="#24262A">대학 연구실 사무 보조</text>
      <text x="724" y="226" font-size="16" font-weight="500" fill="#8B9099" class="tnum">주 8~10시간 · 화 · 목</text>

      <rect x="724" y="242" width="150" height="32" rx="8" fill="#FAFAF9" stroke="#E6E7E9"/>
      <text x="799" y="264" font-size="15" font-weight="600" fill="#5B6068" text-anchor="middle">미검증 규칙 4건</text>
    </g>

    <!-- 카드 2 — 확인 필요 (제한 가능성) -->
    <g>
      <rect x="700" y="306" width="428" height="190" rx="18" fill="#FFFFFF" stroke="#E6E7E9"/>
      <rect x="724" y="332" width="120" height="34" rx="17" fill="#FDF5E7" stroke="#EFDFBF"/>
      <circle cx="744" cy="349" r="4.5" fill="#A06A14"/>
      <text x="757" y="355" font-size="17" font-weight="700" fill="#A06A14">확인 필요</text>
      <text x="1104" y="356" font-size="21" font-weight="800" fill="#24262A" text-anchor="end" class="tnum">시급 12,000원</text>

      <text x="724" y="406" font-size="22" font-weight="700" fill="#24262A">편의점 야간 (주 3일)</text>
      <text x="724" y="436" font-size="16" font-weight="500" fill="#8B9099" class="tnum">주 24시간 · 화 · 목 · 토</text>

      <rect x="724" y="452" width="176" height="32" rx="8" fill="#FDF5E7" stroke="#EFDFBF"/>
      <text x="812" y="474" font-size="15" font-weight="600" fill="#A06A14" text-anchor="middle">주당 시간 초과 가능</text>
    </g>

    <!-- 카드 3 — 불가 (잘려서 보임) -->
    <g>
      <rect x="700" y="516" width="428" height="190" rx="18" fill="#FFFFFF" stroke="#E6E7E9"/>
      <rect x="724" y="542" width="82" height="34" rx="17" fill="#FDF0EE" stroke="#F2CFC9"/>
      <circle cx="744" cy="559" r="4.5" fill="#C0392B"/>
      <text x="757" y="565" font-size="17" font-weight="700" fill="#C0392B">불가</text>
      <text x="1104" y="566" font-size="21" font-weight="800" fill="#24262A" text-anchor="end" class="tnum">시급 13,000원</text>

      <text x="724" y="616" font-size="22" font-weight="700" fill="#24262A">물류센터 상하차 (파견)</text>
    </g>
  </g>

  <!-- 아래쪽 페이드: 카드가 이어진다는 느낌 -->
  <rect x="680" y="560" width="470" height="70" fill="#FAFAF9" opacity="0.0"/>
</svg>
