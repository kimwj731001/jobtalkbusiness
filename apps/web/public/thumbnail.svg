<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="비자잡 — 내 비자에 맞는 일자리 추천. 조건만 고르면 맞는 알바를 찾아드립니다.">
  <title>비자잡 썸네일</title>

  <defs>
    <style>
      .kr { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif; }
      .tnum { font-variant-numeric: tabular-nums; }
    </style>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E6A6E" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#0E6A6E" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#24262A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#FAFAF9"/>
  <rect width="1200" height="630" fill="url(#wash)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#0E6A6E"/>

  <!-- ── 왼쪽: 내가 고른 조건 ──────────────────────── -->
  <g class="kr">
    <text x="80" y="124" font-size="22" font-weight="700" fill="#0E6A6E" letter-spacing="1.5">비자잡 · VisaJob</text>

    <text x="80" y="228" font-size="62" font-weight="800" fill="#24262A" letter-spacing="-1.6">내 비자에 맞는</text>
    <text x="80" y="304" font-size="62" font-weight="800" fill="#24262A" letter-spacing="-1.6">일자리 추천</text>

    <text x="80" y="362" font-size="25" font-weight="500" fill="#5B6068" letter-spacing="-0.3">조건만 고르면 맞는 알바를 찾아드려요</text>

    <!-- 내가 고른 조건 -->
    <text x="80" y="432" font-size="15" font-weight="600" fill="#8B9099" letter-spacing="0.5">내가 고른 조건</text>

    <g>
      <rect x="80" y="450" width="136" height="48" rx="24" fill="#0E6A6E"/>
      <text x="148" y="480" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle">D-2 유학</text>

      <rect x="228" y="450" width="186" height="48" rx="24" fill="#0E6A6E"/>
      <text x="321" y="480" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle">학사 3~4학년</text>

      <rect x="426" y="450" width="152" height="48" rx="24" fill="#0E6A6E"/>
      <text x="502" y="480" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle">TOPIK 4급</text>

      <rect x="80" y="512" width="178" height="48" rx="24" fill="#FFFFFF" stroke="#C9D7D7"/>
      <text x="169" y="542" font-size="19" font-weight="600" fill="#0E6A6E" text-anchor="middle" class="tnum">주 20시간까지</text>

      <rect x="270" y="512" width="214" height="48" rx="24" fill="#FFFFFF" stroke="#C9D7D7"/>
      <text x="377" y="542" font-size="19" font-weight="600" fill="#0E6A6E" text-anchor="middle" class="tnum">시급 12,000원 이상</text>
    </g>

    <text x="80" y="596" font-size="17" font-weight="500" fill="#8B9099">비자로 안 되는 공고는 알아서 걸러드려요</text>
  </g>

  <!-- ── 오른쪽: 추천 결과 ────────────────────────── -->
  <g class="kr">
    <text x="700" y="118" font-size="17" font-weight="700" fill="#5B6068">맞는 공고</text>
    <text x="787" y="118" font-size="17" font-weight="800" fill="#0E6A6E" class="tnum">10건</text>
  </g>

  <g class="kr" filter="url(#lift)">

    <!-- 카드 1 -->
    <g>
      <rect x="700" y="136" width="428" height="150" rx="18" fill="#FFFFFF" stroke="#E6E7E9"/>
      <text x="726" y="182" font-size="23" font-weight="700" fill="#24262A">회기역 카페 바리스타</text>
      <text x="1102" y="182" font-size="24" font-weight="800" fill="#0E6A6E" text-anchor="end" class="tnum">12,500원</text>
      <text x="726" y="214" font-size="16" font-weight="500" fill="#8B9099" class="tnum">주 12시간 · 월 · 수 · 금 오후</text>

      <rect x="726" y="232" width="118" height="32" rx="8" fill="#E9F2F2"/>
      <text x="785" y="254" font-size="15" font-weight="600" fill="#0E6A6E" text-anchor="middle">한국어 초급</text>
      <rect x="854" y="232" width="134" height="32" rx="8" fill="#E9F2F2"/>
      <text x="921" y="254" font-size="15" font-weight="600" fill="#0E6A6E" text-anchor="middle">학교에서 8분</text>
    </g>

    <!-- 카드 2 -->
    <g>
      <rect x="700" y="306" width="428" height="150" rx="18" fill="#FFFFFF" stroke="#E6E7E9"/>
      <text x="726" y="352" font-size="23" font-weight="700" fill="#24262A">연구실 사무 보조</text>
      <text x="1102" y="352" font-size="24" font-weight="800" fill="#0E6A6E" text-anchor="end" class="tnum">12,500원</text>
      <text x="726" y="384" font-size="16" font-weight="500" fill="#8B9099" class="tnum">주 10시간 · 화 · 목 낮</text>

      <rect x="726" y="402" width="134" height="32" rx="8" fill="#E9F2F2"/>
      <text x="793" y="424" font-size="15" font-weight="600" fill="#0E6A6E" text-anchor="middle">시간표 조정</text>
      <rect x="870" y="402" width="118" height="32" rx="8" fill="#E9F2F2"/>
      <text x="929" y="424" font-size="15" font-weight="600" fill="#0E6A6E" text-anchor="middle">교내 근무</text>
    </g>

    <!-- 카드 3 — 잘려서 보임 -->
    <g>
      <rect x="700" y="476" width="428" height="150" rx="18" fill="#FFFFFF" stroke="#E6E7E9"/>
      <text x="726" y="522" font-size="23" font-weight="700" fill="#24262A">편의점 주말 (주 10시간)</text>
      <text x="1102" y="522" font-size="24" font-weight="800" fill="#0E6A6E" text-anchor="end" class="tnum">12,000원</text>
      <text x="726" y="554" font-size="16" font-weight="500" fill="#8B9099" class="tnum">주 10시간 · 토 · 일</text>
    </g>
  </g>
</svg>
